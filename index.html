    <title>食物大亂鬥</title>
<style>
/* 版面：全螢幕 3D 畫布＋疊在上面的卡通 UI。大廳、房間、結算是起司黃（有起司洞），主按鈕番茄紅、面板奶油白；戰鬥畫面用深色半透明 HUD */
:root{
  --cheese:#ffc93c; --cheese-lite:#ffe48a; --cheese-deep:#f2a51a; --hole:#e8960f;
  --tomato:#ff4f38; --tomato-deep:#cf2f1c; --cream:#fff7e2; --cream-2:#fbe9bd; --brown:#5a3408;
  --sky:#1d7bff; --red-team:#ff4b4b; --blue-team:#3a8bff;
  --grn:#41e650; --red:#ff4b4b; --ink:#1c1206; --paper:#ffffff; --hud:rgba(28,18,6,.58);
  --f-disp:"Lilita One","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--cheese);color:var(--paper);font-family:var(--f-body);font-weight:900;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(circle at 9% 30%,var(--hole) 0 38px,transparent 40px),
  radial-gradient(circle at 26% 82%,var(--hole) 0 24px,transparent 26px),
  radial-gradient(circle at 47% 12%,var(--hole) 0 18px,transparent 20px),
  radial-gradient(circle at 88% 22%,var(--hole) 0 30px,transparent 32px),
  radial-gradient(circle at 93% 78%,var(--hole) 0 46px,transparent 48px),
  radial-gradient(circle at 58% 90%,var(--hole) 0 14px,transparent 16px),
  radial-gradient(circle at 38% 48%,var(--hole) 0 11px,transparent 13px),
  repeating-conic-gradient(from 0deg at 64% 56%,rgba(255,255,255,.16) 0 7deg,transparent 7deg 17deg),
  radial-gradient(circle at 64% 56%,var(--cheese-lite),var(--cheese) 48%,var(--cheese-deep) 100%)}
#cv{position:fixed;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:none}
.screen{position:fixed;inset:0;z-index:3;overflow:auto;touch-action:pan-y;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.ot{text-shadow:0 .09em 0 var(--ink),.06em 0 0 var(--ink),-.06em 0 0 var(--ink),0 -.06em 0 var(--ink),.05em .05em 0 var(--ink),-.05em .05em 0 var(--ink),.05em -.05em 0 var(--ink),-.05em -.05em 0 var(--ink),0 .15em 0 var(--ink)}
.btn{border:3px solid var(--ink);border-radius:10px;padding:.55em 1.1em;font-family:var(--f-disp);font-size:20px;cursor:pointer;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 4px 0 var(--ink);transition:transform .08s;letter-spacing:.03em;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 1px 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,.slots li:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn.main{background:var(--tomato);color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.blue{background:var(--sky);color:var(--paper);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.big{font-size:28px;padding:.45em 1.2em}
.btn.small{font-size:15px;padding:.35em .7em}
.btn:disabled{filter:grayscale(.8) brightness(.9);cursor:default}
.btn .ic{width:1em;height:1em;vertical-align:-.12em}
.chip{border:2px solid var(--ink);border-radius:999px;background:var(--cream);color:var(--brown);padding:.22em .75em;font-size:14px;cursor:pointer}
.chip.on{background:var(--tomato);color:var(--paper)}
.chip:disabled{cursor:default}
.chip:disabled:not(.on){opacity:.65}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chips .lab{font-size:13px;margin-right:2px;min-width:3.6em}
.ic{display:inline-block}
.ver{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:max(6px,env(safe-area-inset-bottom,0px));font-size:11px;font-family:var(--f-disp);z-index:4;color:var(--brown)}
.panel{background:var(--cream);color:var(--brown);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink)}

/* ===== 大廳 ===== */
#menu{display:grid;grid-template-columns:minmax(0,360px) 1fr minmax(0,340px);grid-template-rows:auto 1fr;gap:10px 16px}
.mtop{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.logo{white-space:nowrap;font-family:var(--f-disp);font-size:44px;line-height:.95;color:var(--tomato);transform:rotate(-4deg);transform-origin:left;margin:4px 0 0 4px}
.logo small{display:block;font-size:17px;color:var(--paper);letter-spacing:.12em;margin-top:4px}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cur{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(90,52,8,.78);border:2px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.pill .ic{width:26px;height:26px}
.toggles{display:flex;gap:6px}
.toggles .chip{font-size:12px}
.charpanel{grid-column:1;align-self:end;padding:12px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:3px solid var(--ink);border-radius:10px;background:var(--cream-2);color:var(--brown);padding:6px 4px;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);display:block}
.tab.on{background:var(--tomato);color:var(--paper)}
.chhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.chname{font-family:var(--f-disp);font-size:30px;color:var(--ink)}
.chrole{font-size:13px;background:var(--brown);color:var(--cream);border-radius:6px;padding:2px 8px}
.chdesc{margin:0;font-size:13.5px;font-weight:700;line-height:1.5}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:13px}
.bar{height:10px;background:var(--cream-2);border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:var(--grn)}
.stats b{font-family:var(--f-disp);font-weight:400;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink)}
.perks{margin:0;font-size:12px;font-weight:700;line-height:1.45;background:var(--cream-2);border-radius:8px;padding:5px 8px}
.perks b{color:var(--tomato-deep)}
.lvrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lv{font-family:var(--f-disp);font-size:22px;color:var(--ink);display:flex;align-items:center;gap:4px}
.lv .ic{width:1em;height:1em}
.actions{grid-column:3;align-self:end;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.namebox{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--cream-2);border:2px solid var(--ink);border-radius:10px;padding:5px 10px}
.namebox input{flex:1;min-width:0;background:transparent;border:0;font-size:17px;font-weight:900;outline:none;color:var(--ink);user-select:text;-webkit-user-select:text}
.mdesc{margin:0;font-size:12px;font-weight:700;opacity:.85}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#joinBox,#confirmBox{position:fixed;inset:0;z-index:20;background:rgba(60,30,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{padding:18px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.modal h3{margin:0;font-family:var(--f-disp);font-size:24px;font-weight:400;color:var(--ink)}
.modal p{margin:0;font-size:14px;font-weight:700;line-height:1.5}
#codeIn{font-family:var(--f-disp);font-size:44px;letter-spacing:.3em;text-align:center;background:var(--cream-2);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:4px 0 4px .3em;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}

/* ===== 房間 ===== */
#room{display:flex}
.roompanel{padding:14px 16px;width:min(680px,100%);display:grid;grid-template-columns:1.1fr 1fr;gap:10px 18px;margin:auto}
.rleft{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;justify-content:center}
.rtitle{font-size:15px}
.code{font-family:var(--f-disp);font-size:60px;letter-spacing:.12em;color:var(--tomato);line-height:1;font-variant-numeric:tabular-nums}
.rhint{margin:0;font-size:13px;font-weight:700;line-height:1.5}
.slots{grid-column:2;grid-row:1/3;align-self:center;list-style:none;margin:0;padding:0;display:grid;gap:4px}
.slots li{display:flex;align-items:center;gap:8px;background:var(--cream-2);border-radius:8px;padding:4px 8px;font-size:14px;min-height:26px;color:var(--ink)}
.slots li i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.slots li.bot{color:var(--brown);font-weight:700}
.slots li.empty{background:transparent;border:2px dashed rgba(90,52,8,.35);color:rgba(90,52,8,.6);font-weight:700}
.slots li .tag{margin-left:auto;font-size:11px;background:var(--brown);color:var(--cream);border-radius:5px;padding:1px 6px}
.slots li .team{font-size:11px;border-radius:5px;padding:1px 6px;color:var(--paper);border:2px solid var(--ink)}
.slots li .team.t0{background:var(--red-team)}.slots li .team.t1{background:var(--blue-team)}
.slots li.tap{cursor:pointer}
.ropts{grid-column:1;grid-row:2;display:flex;flex-direction:column;gap:5px}
.rbtns{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:1fr 2fr;gap:10px}

/* ===== 結算 ===== */
#result{display:grid;grid-template-columns:minmax(0,340px) 1fr minmax(0,320px);grid-template-rows:auto 1fr auto;gap:10px 16px;align-content:start}
.rtro{grid-column:1;display:flex;flex-direction:column;gap:2px}
.tdelta{font-family:var(--f-disp);font-size:58px;line-height:1;display:flex;align-items:center;gap:6px}
.tdelta .ic{width:64px;height:64px}
.tline{font-family:var(--f-disp);font-size:24px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.tline .ic{width:26px;height:26px}
.rhead{grid-column:3;text-align:right}
.rhead .s{font-family:var(--f-disp);font-size:22px;font-style:italic}
.rhead .b{font-family:var(--f-disp);font-size:44px;color:var(--tomato);font-style:italic;line-height:1.05;transform:rotate(-3deg)}
.coinpanel{grid-column:1;grid-row:2/4;align-self:start;min-width:0;border-radius:8px}
.coinpanel .cpt{text-align:center;font-family:var(--f-disp);font-size:24px;color:var(--tomato);padding:8px 0 4px}
.crow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:4px 14px;font-size:17px;align-items:center}
.crow b{font-family:var(--f-disp);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums;background:var(--brown);color:var(--cream);padding:0 10px;border-radius:4px;min-width:50px;text-align:right}
.ctotal{border-radius:0 0 5px 5px;background:var(--cheese);color:var(--ink);margin-top:8px;padding:6px 14px 10px;text-align:center;border-top:3px solid var(--ink)}
.ctotal .t{font-family:var(--f-disp);font-size:16px}
.ctotal .v{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-disp);font-size:40px;color:var(--paper)}
.ctotal .ic{width:40px;height:40px}
.rlist{grid-column:3;grid-row:2;list-style:none;margin:0;padding:0;display:grid;gap:3px;align-self:center;min-width:0}
.rlist li{display:grid;grid-template-columns:28px 18px 1fr auto;gap:6px;align-items:center;background:rgba(90,52,8,.72);border-radius:7px;padding:3px 8px;font-size:14px}
.rlist li.me{background:var(--tomato)}
.rlist li .n{font-family:var(--f-disp);font-size:16px}
.rlist li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.rlist li i.t0{box-shadow:0 0 0 2px var(--red-team)}.rlist li i.t1{box-shadow:0 0 0 2px var(--blue-team)}
.rlist li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlist li .sc{font-family:var(--f-disp);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rbtns2{grid-column:3;grid-row:3;display:grid;grid-template-columns:3fr 2fr;gap:10px;align-self:end}

/* ===== 戰鬥 HUD ===== */
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
#hud>*{pointer-events:none}
#labels{position:absolute;inset:0;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:1px;will-change:transform}
.lbl .top{display:flex;align-items:center;gap:3px;font-family:var(--f-disp);font-size:14px;white-space:nowrap}
.lbl .bdg{display:inline-grid;place-items:center;min-width:18px;height:18px;background:var(--cheese);color:var(--ink);border:2px solid var(--ink);border-radius:5px;font-size:12px;text-shadow:none;padding:0 2px}
.lbl.t0 .bdg{background:var(--red-team);color:var(--paper)}.lbl.t1 .bdg{background:var(--blue-team);color:var(--paper)}
.lbl .nm{color:var(--paper)}
.lbl.me .nm{color:var(--grn)}
.lbl .hp{position:relative;width:68px;height:13px;background:var(--ink);border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.lbl .hp i{position:absolute;inset:0 auto 0 0;background:var(--red)}
.lbl.me .hp i,.lbl.mate .hp i{background:var(--grn)}
.lbl .hp b{position:relative;display:block;text-align:center;font-family:var(--f-disp);font-weight:400;font-size:11px;line-height:13px;font-variant-numeric:tabular-nums}
.lbl .am{display:flex;gap:2px;width:68px}
.lbl .am i{height:6px;border-radius:3px;background:#3a3a50;border:1px solid var(--ink);overflow:hidden;position:relative}
.lbl .am i u{position:absolute;inset:0 auto 0 0;background:#3aa0ff}
.lbl .sp{width:68px;height:5px;border-radius:3px;background:#3a3a50;border:1px solid var(--ink);overflow:hidden}.lbl .sp u{display:block;height:100%;background:var(--cheese)}
.lbl .pw{font-size:11px;color:var(--cheese)}
.lbl .emo{position:absolute;bottom:100%;margin-bottom:4px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:2px 9px;font-size:15px;white-space:nowrap;text-shadow:none;animation:bub .25s ease-out}
@keyframes bub{from{transform:scale(.3)}}
.dmg{position:absolute;left:0;top:0;font-family:var(--f-disp);font-size:20px;color:var(--paper);will-change:transform}
.dmg.mine{color:var(--cheese)}
.dmg.heal{color:var(--grn)}
#topbar{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:3px}
#timer{font-family:var(--f-disp);font-size:34px;font-variant-numeric:tabular-nums;background:var(--hud);border:2px solid var(--ink);border-radius:12px;padding:0 14px;white-space:nowrap}
#timer.hot{color:var(--red)}
#sub{font-size:13px;background:var(--hud);border-radius:8px;padding:1px 10px}
#goalbar{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:24px}
#goalbar span{min-width:38px;text-align:center;border:2px solid var(--ink);border-radius:8px;padding:0 8px}
#goalbar .g0{background:var(--red-team)}#goalbar .g1{background:var(--blue-team)}
#board{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;font-size:13px}
#board div{display:flex;gap:6px;align-items:center;background:var(--hud);border-radius:6px;padding:1px 8px;min-width:120px}
#board div.me{background:rgba(255,201,60,.95);color:var(--ink);text-shadow:none}
#board div b{margin-left:auto;font-family:var(--f-disp);font-weight:400;font-size:15px}
#feed{position:absolute;top:max(92px,calc(env(safe-area-inset-top,0px) + 84px));right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:13px}
#feed div{background:var(--hud);border-radius:6px;padding:2px 8px;animation:fin .2s}
#feed div em{font-style:normal;color:var(--cheese)}
@keyframes fin{from{transform:translateX(20px);opacity:0}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--f-disp);font-size:60px;color:var(--cheese);opacity:0;padding:0 16px}
#banner.show{animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:scale(2.2);opacity:0}18%{transform:scale(1);opacity:1}75%{opacity:1}100%{opacity:0}}
#deadmsg{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:22px;padding:0 16px}
#deadmsg b{font-family:var(--f-disp);font-size:46px;color:var(--cheese);display:block}
.tr{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.tr button{pointer-events:auto;font-size:13px;padding:.3em .8em;border:2px solid var(--ink);border-radius:8px;background:var(--hud);cursor:pointer}
#emoPanel{position:absolute;top:max(46px,calc(env(safe-area-inset-top,0px) + 40px));right:max(10px,env(safe-area-inset-right,0px));pointer-events:auto;display:grid;grid-template-columns:repeat(3,auto);gap:5px;background:var(--hud);border:2px solid var(--ink);border-radius:12px;padding:6px}
#emoPanel button{border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);font-size:15px;padding:6px 8px;cursor:pointer;white-space:nowrap}
.joyzone{position:absolute;left:0;bottom:0;width:48%;height:70%;pointer-events:auto!important;touch-action:none}
.joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.35)}
.joy .kn,.abtn .kn{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid var(--ink)}
.abtn{position:absolute;border-radius:50%;pointer-events:auto!important;touch-action:none;border:3px solid var(--ink)}
#btnAtk{width:116px;height:116px;right:max(26px,calc(env(safe-area-inset-right,0px) + 18px));bottom:max(26px,calc(env(safe-area-inset-bottom,0px) + 18px));background:rgba(255,80,40,.55)}
#btnAtk .kn{background:#ff6a3a}
#btnSup{width:80px;height:80px;right:max(160px,calc(env(safe-area-inset-right,0px) + 150px));bottom:max(36px,calc(env(safe-area-inset-bottom,0px) + 28px));
  background:conic-gradient(var(--cheese) calc(var(--p,0)*1turn),rgba(40,40,60,.55) 0)}
#btnSup .kn{width:40px;height:40px;margin:-20px 0 0 -20px;background:#9aa0b4}
#btnSup.ready{animation:glow .7s infinite alternate}
#btnSup.ready .kn{background:var(--cheese)}
.suplab{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:13px;white-space:nowrap;pointer-events:none}
#btnSup.ready .suplab{color:var(--cheese);font-size:15px}
@keyframes glow{to{box-shadow:0 0 22px 6px rgba(255,201,60,.85)}}
.fine .joyzone,.fine .abtn{display:none}
#keyhint{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12px;opacity:.8;white-space:nowrap;display:none}
.fine #keyhint{display:block}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);z-index:30;background:var(--ink);border:2px solid var(--cheese);border-radius:10px;padding:8px 14px;font-size:15px;max-width:min(90vw,460px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#loading{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--cheese);color:var(--ink);font-family:var(--f-disp);font-size:28px}

/* v0.3：九隻角色分頁、稀有度、天賦、寶箱／任務／造型面板、墨汁 */
.tabs{overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:58px;font-size:13px;padding:4px 6px;border-bottom:5px solid var(--tc)}
.tab i{width:18px;height:18px}
.tab small{font-size:9.5px;font-weight:700;opacity:.85}
.tab.locked{opacity:.6}.tab.locked.on{opacity:1}
.tierb{font-size:12px;color:var(--paper);border-radius:6px;padding:2px 8px;border:2px solid var(--ink)}
.chips.tal small{font-size:11.5px;font-weight:700;flex-basis:100%}
.mbtns{display:flex;gap:6px}
.mbtns .chip{font-size:13px;position:relative;background:var(--tomato);color:var(--paper)}
.badge{position:absolute;top:-8px;right:-8px;background:var(--grn);color:var(--ink);font-style:normal;border:2px solid var(--ink);border-radius:999px;min-width:18px;height:18px;font-size:11px;display:grid;place-items:center;padding:0 3px;box-sizing:border-box}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(60,30,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:min(440px,100%);max-height:92vh;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.sheet .sh{display:flex;justify-content:space-between;align-items:center}
.sheet h3{margin:0;font-family:var(--f-disp);font-weight:400;font-size:24px;color:var(--ink)}
#sheetBody{display:flex;flex-direction:column;gap:10px}
.sp{margin:0;font-size:13px;font-weight:700;line-height:1.5}
.chres{text-align:center;border:3px solid var(--ink);border-radius:12px;background:var(--tc);color:var(--paper);padding:10px;animation:bub .3s ease-out}
.chres .tier{font-size:13px}.chres .big{font-family:var(--f-disp);font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.35)}.chres .nm{font-size:20px}.chres .cn{font-family:var(--f-disp);font-size:18px}
.sheet .ic{width:1em;height:1em;vertical-align:-.12em}
.tasks,.wards{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tasks li{background:var(--cream-2);border-radius:10px;padding:8px 10px;display:grid;gap:5px}
.tasks li.done{background:#e3f7c8}
.tasks .tt{font-size:14px;color:var(--ink)}
.tr2{display:flex;gap:10px;align-items:center;font-size:12.5px}.tr2 .btn{margin-left:auto}.tr2 .ok{margin-left:auto;color:#3a8a1a}
.wards li{display:flex;align-items:center;gap:10px;background:var(--cream-2);border-radius:10px;padding:6px 10px}
.wards .an{font-size:15px;color:var(--ink)}.wards .as{font-size:12px;opacity:.75}.wards .btn{margin-left:auto}
#ink{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle at 50% 52%,rgba(10,8,20,.2) 0 90px,rgba(10,8,20,.94) 190px)}

@media (max-width:820px){
  #menu{grid-template-columns:minmax(0,320px) 1fr minmax(0,300px)}
  .logo{font-size:36px}
  .btn.big{font-size:24px}
  #result{grid-template-columns:minmax(0,290px) 1fr minmax(0,270px)}
  .tdelta{font-size:46px}.tdelta .ic{width:50px;height:50px}
  .rhead .b{font-size:36px}
}
@media (max-height:460px){
  .logo{font-size:30px}.logo small{font-size:13px}.pill{font-size:16px}.pill .ic{width:22px;height:22px}
  .charpanel{padding:7px 10px;gap:4px}.chname{font-size:22px}.chdesc{font-size:11.5px;line-height:1.4}.perks{font-size:11px;padding:3px 7px}
  .tab{padding:3px 4px;font-size:14px}.tab i{width:16px;height:16px}.stats{gap:2px 8px}

  .rlist li{padding:1px 8px}.coinpanel .cpt{font-size:19px;padding:4px 0 2px}.ctotal{margin-top:4px;padding:3px 14px 6px}.rbtns2 .btn.big{font-size:20px}
  .tdelta{font-size:40px}.tdelta .ic{width:44px;height:44px}.rhead .b{font-size:32px}
  .ctotal .v{font-size:30px}.ctotal .ic{width:30px;height:30px}.crow{font-size:15px;padding:2px 14px}
  #btnAtk{width:100px;height:100px}#btnSup{width:70px;height:70px;right:max(140px,calc(env(safe-area-inset-right,0px) + 130px))}

  .tab{min-width:50px;font-size:12px;padding:2px 5px}.tab small{display:none}.chips.tal small{display:none}.mbtns .chip{font-size:12px}.mright{gap:4px}
  .mright{display:grid;grid-template-columns:auto auto;justify-items:end;gap:4px 6px}.cur{grid-column:1/-1}
  .tab{padding:2px 5px;gap:0}.tab i{width:14px;height:14px}
  .stats{grid-template-columns:auto 1fr auto auto 1fr auto;gap:2px 6px;font-size:12px}.stats b{font-size:12px}.bar{height:8px}
  .chdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .perks{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lv{font-size:18px}.btn.small{font-size:13px;padding:.25em .6em}
  .charpanel{gap:3px}.chhead{gap:6px}.chname{font-size:20px}
}
@media (max-width:640px) and (orientation:portrait){
  #menu{grid-template-columns:1fr;grid-template-rows:auto 30vh auto auto;align-content:start}

/* ===== 大廳改版 ===== */
#menu{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr) minmax(0,280px);grid-template-rows:auto minmax(0,1fr);gap:10px 16px}

#pick{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);grid-template-rows:auto minmax(0,1fr);gap:8px 14px}
.phead{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.phead .pttl{font-family:var(--f-disp);font-size:30px;color:var(--paper);flex:1;line-height:1}
.plist{display:flex;flex-direction:column;gap:8px;padding:10px;min-height:0;min-width:0}
.rtabs{display:flex;gap:5px;overflow-x:auto;flex:none;padding-bottom:2px}.rtabs .chip{flex:none;font-size:14px}
.pgrid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;align-content:start;min-height:0;flex:1;padding:6px 4px 4px 2px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pc{position:relative;border:3px solid var(--ink);border-radius:10px;background:var(--cream-2);color:var(--brown);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;box-shadow:inset 0 -5px 0 var(--tc)}

function pushBox(p,cx,cz,hx,hz,r){const nx=clamp(p.x,cx-hx,cx+hx),nz=clamp(p.z,cz-hz,cz+hz);const dx=p.x-nx,dz=p.z-nz,d2=dx*dx+dz*dz;if(d2>=r*r)return;

function beep(f1,f2,dur,type,vol){if(!save.sfx||!AC||AC.state!=='running')return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}

  pick:()=>{beep(620,1240,.12,'sine',.08)},slip:()=>beep(1000,180,.35,'sine',.07),sup:()=>beep(220,960,.3,'square',.06),crate:()=>beep(160,60,.15,'triangle',.1),tick:()=>beep(880,880,.08,'sine',.06),

  if(!save.music||!name||musicBad[name])return;let a=musicEls[name];
  if(!a){try{a=new Audio(MUSIC[name]);a.loop=true;a.volume=name==='lobby'?.4:.5;a.addEventListener('error',()=>{musicBad[name]=true});musicEls[name]=a}catch(e){return}}
  try{a.currentTime=0}catch(e){}const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{if(musicCur===name)musicCur=''})}

  if(st.mode==='royale'){const left=st.players.filter(p=>!p.out).length;txt='剩 '+left+' 人'}
  else{const tm=Math.ceil(st.time);txt=Math.floor(tm/60)+':'+String(tm%60).padStart(2,'0');tEl.classList.toggle('hot',tm<=10&&st.startT<=0);
    if(tm<=30&&st.startT<=0&&!finalOn){finalOn=true;playMusic('final')}}
  if(tEl.textContent!==txt)tEl.textContent=txt;
  if(st.startT>0){const n=Math.ceil(st.startT);if(n!==lastBanner){lastBanner=n;banner(String(n));SFX.tick()}}
  else if(lastBanner>0){lastBanner=0;banner('開打！')}
  else if(lastBanner===0&&st.mode!=='royale'&&Math.ceil(st.time)<=10&&st.time>0){lastBanner=-2;banner('最後 10 秒！')}
  if(st.mode==='soccer'){const g=st.goals||[0,0];if($('#g0').textContent!=String(g[0]))$('#g0').textContent=g[0];if($('#g1').textContent!=String(g[1]))$('#g1').textContent=g[1]}
  const me=st.players[meId];
  if(st.mode==='royale'&&me){const s=me.out?'觀戰中':me.lives>1?'還可以復活 1 次':'最後一條命！';if($('#sub').textContent!==s)$('#sub').textContent=s}
  if(st.mode!=='soccer'){const sorted=st.players.slice().sort((a,b)=>b.score-a.score||a.deaths-b.deaths||a.id-b.id);const myR=sorted.findIndex(p=>p.id===meId);
    const show=sorted.slice(0,3);if(myR>=3)show.push(sorted[myR]);
    const key=show.map(p=>p.id+':'+p.score+(p.out?'x':'')).join(',');const bd=$('#board');
    if(bd.dataset.k!==key){bd.dataset.k=key;bd.innerHTML=show.map(p=>`<div class="ot${p.id===meId?' me':''}">${sorted.indexOf(p)+1}. ${esc(p.name)}${p.out?'（出局）':''}<b>${p.score}</b></div>`).join('')}}
  if(!me)return;
  $('#ink').style.opacity=me.alive&&me.ink?1:0;
  const dm=$('#deadmsg');
  if(!me.alive&&st.startT<=0){dm.hidden=false;let h;
    if(me.out)h=`你出局了<b>第 ${me.place||'?'} 名</b>正在觀戰其他人`;
    else{const by=dm.dataset.by;h=`${by?esc(by)+' 打倒了你':'你倒下了'}<b>${Math.max(0,me.respawnT).toFixed(1)}</b>秒後復活${st.mode==='royale'?'・這是最後一條命':''}`}
    if(dm.innerHTML!==h)dm.innerHTML=h}else dm.hidden=true;
  const sb=$('#btnSup'),ready=me.sup>=1;sb.style.setProperty('--p',me.sup.toFixed(3));sb.classList.toggle('ready',ready);
  const sl=ready?'大招好了！':'大招 '+Math.floor(me.sup*100)+'%';if($('#supLab').textContent!==sl)$('#supLab').textContent=sl;
  if(ready&&!supWas&&me.alive){banner(FINE?'大招好了！按右鍵或 E':'大招好了！按黃色按鈕');SFX.sup()}supWas=ready}

  if(R.domElement.width!==Math.floor(innerWidth*R.getPixelRatio())||R.domElement.height!==Math.floor(innerHeight*R.getPixelRatio()))R.setSize(innerWidth,innerHeight,false);

  else if(act==='claim'){const m=save.daily.list[+b.dataset.i];if(!m||m.claimed||m.p<m.t)return;m.claimed=true;if(m.rw==='chest')save.chests++;else save.coins+=m.rw;persist();SFX.pick();openSheet('每日任務',taskSheet())}
  else if(act==='buya'){const k=b.dataset.k,a=ACCS[k];if(save.accOwned.includes(k)||save.coins<a.price)return;save.coins-=a.price;save.accOwned.push(k);const eq=save.accEq[wardId]=save.accEq[wardId]||{};eq[a.slot]=k;persist();SFX.pick();openSheet('造型',wardSheet())}
  else if(act==='wear'){const k=b.dataset.k,a=ACCS[k];const eq=save.accEq[wardId]=save.accEq[wardId]||{};eq[a.slot]=eq[a.slot]===k?'':k;persist();openSheet('造型',wardSheet())}
  refreshUI()});
function renderRoom(){const host=NET.host,m=host?lobbyMsg():NET.lobbyMsg,o=m?m.opts:NET.opts,soccer=o.mode==='soccer';
  $('#rHint').textContent=host?'同一個 WiFi 的朋友打開這個遊戲 → 加入房間 → 輸入代碼'+(soccer?'。點玩家可以換隊':''):NET.joined?'等房主按開始…':'連線中…';
  const rows=[];if(m){rows.push({...m.host,tag:'房主',idx:-1});m.list.forEach((l,i)=>rows.push({...l,idx:i}))}
  const humans=rows.length,bots=Math.min(o.bots,8-humans);
  let html=rows.map(r=>`<li class="${host&&soccer?'tap':''}" data-i="${r.idx}" ${host&&soccer?'tabindex="0"':''}><i style="background:${(CHARS[r.ch]||CHARS.apple).col}"></i><span class="nm"></span>${soccer?`<span class="team t${r.team|0}">${r.team?'藍隊':'紅隊'}</span>`:''}${r.tag?'<span class="tag">房主</span>':''}</li>`).join('');
  for(let i=0;i<bots;i++)html+='<li class="bot">電腦</li>';for(let i=humans+bots;i<8;i++)html+='<li class="empty">空位</li>';
  $('#rSlots').innerHTML=html;
  [...$('#rSlots').querySelectorAll('.nm')].forEach((el,i)=>el.textContent=rows[i].name+'・'+(CHARS[rows[i].ch]||CHARS.apple).name+(o.lv==='own'?' Lv'+rows[i].lvl:''));
  const maxBots=Math.max(0,8-Math.max(1,humans));const botVals=[];for(let i=0;i<=maxBots;i++)botVals.push([i,String(i)]);
  $('#rOpts').innerHTML=`<div class="chips">${chipsHTML('模式','mode',[['score','搶分'],['royale','吃雞'],['soccer','足球']],o.mode,!host)}</div>`+
    (o.mode!=='royale'?`<div class="chips">${chipsHTML('時間','dur',[[90,'90 秒'],[180,'180 秒']],o.dur,!host)}</div>`:'')+
    `<div class="chips">${chipsHTML('電腦','bots',botVals,bots,!host)}</div>`+
    `<div class="chips">${chipsHTML('強度','diff',DIFF.map((d,i)=>[i,d.name]),o.diff,!host)}</div>`+
    `<div class="chips">${chipsHTML('等級','lv',[['fair','大家 1 級'],['own','自己的等級']],o.lv,!host)}</div>`+
    (!soccer?`<div class="chips">${chipsHTML('地圖','map',[['rand','隨機'],...MAP_POOL.map(k=>[k,MAPS[k].name])],o.map,!host)}</div>`:'');
  const sb=$('#rStart');sb.hidden=!host;sb.disabled=!(NET.peer&&NET.peer.open)}
$('#rOpts').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b||!NET.host)return;const k=b.dataset.k;NET.opts[k]=(k==='diff'||k==='bots'||k==='dur')?+b.dataset.v:b.dataset.v;broadcastLobby()});
$('#rSlots').addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(!li||!NET.host||NET.opts.mode!=='soccer')return;const i=+li.dataset.i;
  if(i<0)NET.hostTeam=1-NET.hostTeam;else if(NET.lobby[i])NET.lobby[i].team=1-(NET.lobby[i].team|0);broadcastLobby()});
$('#rStart').addEventListener('click',()=>{audioOn();hostStart()});
$('#rLeave').addEventListener('click',()=>{netClose();showScreen('menu')});
$('#resAgain').addEventListener('click',()=>{if(online){if(!NET.peer){showScreen('menu');return}showScreen('room');if(NET.host)broadcastLobby();else renderRoom()}else startSolo()});
$('#resLobby').addEventListener('click',()=>{netClose();showScreen('menu')});
$('#btnQuit').addEventListener('click',()=>{$('#confirmTxt').textContent=online&&NET.host?'你是房主，離開的話這場會結束，大家都回大廳。':'離開不會拿到獎盃和金幣。';$('#confirmBox').hidden=false});
$('#cfNo').addEventListener('click',()=>{$('#confirmBox').hidden=true});
$('#cfYes').addEventListener('click',()=>{$('#confirmBox').hidden=true;leaveMatch()});

function boot(){
  if(typeof THREE==='undefined'){$('#loading').textContent='3D 引擎載不進來，請連上網路再開一次';return}
  try{R=new THREE.WebGLRenderer({canvas:cvEl,antialias:true,alpha:true});}catch(e){$('#loading').textContent='這台裝置不支援 3D 畫面';return}
  R.setPixelRatio(Math.min(devicePixelRatio||1,1.75));R.setSize(innerWidth,innerHeight,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setClearColor(0x000000,0);
  initGeo();initMenu3D();$('#loading').remove();showScreen('menu');requestAnimationFrame(frame)}
boot();
