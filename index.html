    <title>食物大亂鬥</title>
<style>
/* 版面：全螢幕 3D 畫布＋疊在上面的卡通 UI。大廳、房間、結算是起司黃（有起司洞），主按鈕番茄紅、面板奶油白；戰鬥畫面用深色半透明 HUD */
:root{
  --cheese:#ffc93c; --cheese-lite:#ffe48a; --cheese-deep:#f2a51a; --hole:#e8960f;
  --tomato:#ff4f38; --tomato-deep:#cf2f1c; --cream:#fff7e2; --cream-2:#fbe9bd; --brown:#5a3408;
  --sky:#1d7bff; --red-team:#ff4b4b; --blue-team:#3a8bff;
  --grn:#41e650; --red:#ff4b4b; --ink:#1c1206; --paper:#ffffff; --hud:rgba(28,18,6,.58);
  --f-disp:"Lilita One","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--cheese);color:var(--paper);font-family:var(--f-body);font-weight:900;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(circle at 9% 30%,var(--hole) 0 38px,transparent 40px),
  radial-gradient(circle at 26% 82%,var(--hole) 0 24px,transparent 26px),
  radial-gradient(circle at 47% 12%,var(--hole) 0 18px,transparent 20px),
  radial-gradient(circle at 88% 22%,var(--hole) 0 30px,transparent 32px),

/* ===== 大廳 ===== */

/* ===== 戰鬥 HUD ===== */

.tr{position:absolute;top:max(8px,env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;gap:6px}

  background:conic-gradient(var(--cheese) calc(var(--p,0)*1turn),rgba(40,40,60,.55) 0)}

/* ================= 基本工具 ================= */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const r2=v=>Math.round(v*100)/100;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),ms)}

/* ================= 存檔 ================= */
const SAVE_KEY='foodbrawl-save-v1';
let save={name:'',trophies:0,coins:0,lvl:{},ch:'apple',diff:1,mode:'score',dur:180,music:true,sfx:true,
  owned:['apple','sushi','eggplant'],shards:{},tal:{},chests:1,matches:0,accOwned:[],accEq:{},daily:null};

if(!save.name)save.name='玩家'+Math.floor(rnd(100,999));

function steerSet(g,p,gx,gz){const I=p.inp,L=Math.hypot(gx,gz);if(L<.05){I.mx=0;I.mz=0;return}gx/=L;gz/=L;

  I.mx=gx;I.mz=gz}
function soccerChaser(g,p){const b=g.ball,I=p.inp,ai=p.ai,D=g.diff;

  if(best!==p)return false;
  const egz=p.team===0?-g.bz-1:g.bz+1;let tx=-b.x,tz=egz-b.z;const tl=Math.hypot(tx,tz)||1;tx/=tl;tz/=tl;

  if(ahead>-.3&&dpa>1){const sx=-tz,sz=tx,side=((p.x-b.x)*sx+(p.z-b.z)*sz)>=0?1:-1;mx=ax+sx*side*1.8-p.x;mz=az+sz*side*1.8-p.z}
  else if(dpa>.9){mx=ax-p.x;mz=az-p.z}else{mx=tx;mz=tz}

  steerSet(g,p,mx,mz);return true}

    else{let it=null,bd=12;for(const o of g.items){const d=Math.hypot(o.x-p.x,o.z-p.z);if(d<bd){bd=d;it=o}}

          else if(g.los(p.x,p.z,c.x,c.z,c)||p.ch==='avocado'){if(p.ammo>=1.5&&ai.fireCd<=0){const a=Math.atan2(c.x-p.x,c.z-p.z);I.ax=Math.sin(a);I.az=Math.cos(a);I.f++;ai.fireCd=.6}}
          else{gx=c.x-p.x;gz=c.z-p.z}}

          gx=ai.wp.x-p.x;gz=ai.wp.z-p.z}}}}
  if(D.dodge>0&&p.rollT<=0)for(const b of g.proj){if(!foe(g.players[b.owner],p))continue;const rx=p.x-b.x,rz=p.z-b.z;if(rx*rx+rz*rz>25)continue;const bs=Math.hypot(b.vx,b.vz)||1;

$('#btnQuit').addEventListener('click',()=>{$('#confirmTxt').textContent=online&&NET.host?'你是房主，離開的話這場會結束，大家都回大廳。':'離開不會拿到獎盃和金幣。';$('#confirmBox').hidden=false});
$('#cfNo').addEventListener('click',()=>{$('#confirmBox').hidden=true});
$('#cfYes').addEventListener('click',()=>{$('#confirmBox').hidden=true;leaveMatch()});

/* ================= 啟動 ================= */
function boot(){
  if(typeof THREE==='undefined'){$('#loading').textContent='3D 引擎載不進來，請連上網路再開一次';return}
  try{R=new THREE.WebGLRenderer({canvas:cvEl,antialias:true,alpha:true});}catch(e){$('#loading').textContent='這台裝置不支援 3D 畫面';return}
  R.setPixelRatio(Math.min(devicePixelRatio||1,1.75));R.setSize(innerWidth,innerHeight,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.setClearColor(0x000000,0);
  initGeo();initMenu3D();$('#loading').remove();showScreen('menu');requestAnimationFrame(frame)}
boot();
</script>
